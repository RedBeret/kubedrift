# Demo baseline: a small "parts shop" stack with the usual suspects.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOG_LEVEL: info
  CACHE_TTL: "300"
  FEATURE_BULK_EXPORT: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  username: parts_api
  password: local-demo-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parts-api
  template:
    metadata:
      labels:
        app: parts-api
    spec:
      containers:
        - name: api
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-cache
  template:
    metadata:
      labels:
        app: legacy-cache
    spec:
      containers:
        - name: cache
          image: redis:7-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: parts-api
spec:
  selector:
    app: parts-api
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: cache-hs
spec:
  clusterIP: None
  selector:
    app: session-cache
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: session-cache
spec:
  serviceName: cache-hs
  replicas: 1
  selector:
    matchLabels:
      app: session-cache
  template:
    metadata:
      labels:
        app: session-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parts-api
spec:
  rules:
    - host: parts.demo.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: parts-api
                port:
                  number: 80
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: parts-api
                port:
                  number: 80
