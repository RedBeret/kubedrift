# Demo baseline: a small "parts shop" stack with the usual suspects.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOG_LEVEL: info
  CACHE_TTL: "300"
  FEATURE_BULK_EXPORT: "false"
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  username: parts_api
  password: local-demo-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parts-api
  template:
    metadata:
      labels:
        app: parts-api
    spec:
      containers:
        - name: api
          image: nginx:1.25-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-cache
  template:
    metadata:
      labels:
        app: legacy-cache
    spec:
      containers:
        - name: cache
          image: redis:7-alpine
---
apiVersion: v1
kind: Service
metadata:
  name: parts-api
spec:
  selector:
    app: parts-api
  ports:
    - name: http
      port: 80
      targetPort: 80
