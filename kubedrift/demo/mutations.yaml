# Demo mutations: the kind of drift that happens during a bad week.
#   - parts-api image bumped                       -> IMAGE
#   - worker scaled to zero                        -> BREAKING
#   - FEATURE_BULK_EXPORT flag flipped             -> INFORMATIONAL
#   - CACHE_TTL key removed                        -> BREAKING
#   - new metrics-exporter deployment              -> ADDITIVE
#   - session-cache statefulset scaled 1 -> 2      -> ADDITIVE
#   - node-agent daemonset image bumped            -> IMAGE
#   - /admin ingress route removed                 -> BREAKING
# (the demo runner also deletes legacy-cache      -> BREAKING)
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  LOG_LEVEL: info
  FEATURE_BULK_EXPORT: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: parts-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parts-api
  template:
    metadata:
      labels:
        app: parts-api
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: LOG_LEVEL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 0
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-exporter
  template:
    metadata:
      labels:
        app: metrics-exporter
    spec:
      containers:
        - name: exporter
          image: busybox:1.36
          command: ["sleep", "infinity"]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: session-cache
spec:
  serviceName: cache-hs
  replicas: 2
  selector:
    matchLabels:
      app: session-cache
  template:
    metadata:
      labels:
        app: session-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.37
          command: ["sleep", "infinity"]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parts-api
spec:
  rules:
    - host: parts.demo.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: parts-api
                port:
                  number: 80
